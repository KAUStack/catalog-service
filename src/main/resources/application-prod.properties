spring.application.name=catalog-service

# Server Configuration
server.servlet.context-path=${SERVER_CONTEXT_PATH:/catalog}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
server.port=41619

# Database Connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalog}
spring.datasource.username=${DB_USER:catalog_user}
spring.datasource.password=${DB_PASS:catalog_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration (allows connection pool to scale to 0 when idle for Neon)
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}

# SQL Logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Postgres Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.roles=ACTUATOR
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=false
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState
